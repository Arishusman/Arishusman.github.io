<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Checkout | A.U SHOP</title>

<link rel="canonical" href="https://arishusman.github.io/checkout.html">

<link rel="stylesheet" href="style.css">

</head>


<body>



<div class="checkout-box">



<h1>
🛒 Complete Your Order
</h1>



<h2>
Selected Product
</h2>



<div class="selected-product-box">

<div id="selectedProduct">

Loading Product...

</div>

</div>


<div class="order-summary">

    <h3>Order Summary</h3>

    <p id="subTotal"></p>

    <p id="shipping"></p>

    <hr>

    <p id="grandTotal"></p>

</div>



<label>
📦 Quantity
</label>


<input 
type="number"
id="quantity"
value="1"
min="1"
>






<label>
👤 Full Name
</label>


<input

type="text"

id="name"

placeholder="Enter your full name"

>






<label>
📞 Phone Number
</label>


<input

type="text"

id="phone"

placeholder="Enter phone number"

>







<label>
📍 Complete Address
</label>


<textarea

id="address"

placeholder="Enter complete delivery address"

></textarea>






<button onclick="placeOrder()">

Confirm Order ✅

</button>




</div>






<script src="script.js"></script>


</body>

</html>
