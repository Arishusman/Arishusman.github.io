<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard - A.U SHOP</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f4f6f9;
    padding:30px;
}

h1{
    text-align:center;
    color:#222;
    margin-bottom:25px;
}

/* Dashboard Cards */

.dashboard{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-bottom:30px;
}

.card{

    color:white;
    padding:25px;
    border-radius:12px;
    text-align:center;
    box-shadow:0 5px 15px rgba(0,0,0,.15);

}

.card h2{
    font-size:35px;
    margin-bottom:10px;
}

.total{
    background:#007bff;
}

.progress{
    background:#ffc107;
    color:black;
}

.shipped{
    background:#17a2b8;
}

.delivered{
    background:#28a745;
}

/* Search */

.top-bar{

display:flex;
justify-content:center;
gap:15px;
flex-wrap:wrap;
margin-bottom:25px;

}

.top-bar input,
.top-bar select{

padding:12px;
border:1px solid #ccc;
border-radius:8px;
font-size:15px;
width:280px;

}

/* Table */

table{

width:100%;
background:white;
border-collapse:collapse;
border-radius:10px;
overflow:hidden;
box-shadow:0 5px 15px rgba(0,0,0,.1);

}

th{

background:#222;
color:white;
padding:15px;

}

td{

padding:12px;
text-align:center;
border-bottom:1px solid #eee;

}

tr:hover{

background:#f7f7f7;

}

/* Buttons */

button{

padding:8px 15px;
border:none;
border-radius:5px;
cursor:pointer;
margin:2px;
color:white;

}

button:first-child{

background:#28a745;

}

button:last-child{

background:#dc3545;

}

button:hover{

opacity:.85;

}

select{

padding:8px;

}

@media(max-width:768px){

.dashboard{

grid-template-columns:1fr;

}

table{

display:block;
overflow-x:auto;

}

}

</style>

</head>

<body>

<h1>A.U SHOP ADMIN DASHBOARD</h1>

<!-- Dashboard -->

<div class="dashboard">

<div class="card total">
<h2 id="totalOrders">0</h2>
<p>Total Orders</p>
</div>

<div class="card progress">
<h2 id="progressOrders">0</h2>
<p>In Progress</p>
</div>

<div class="card shipped">
<h2 id="shippedOrders">0</h2>
<p>Shipped</p>
</div>

<div class="card delivered">
<h2 id="deliveredOrders">0</h2>
<p>Delivered</p>
</div>

</div>

<!-- Search -->

<div class="top-bar">

<input
type="text"
id="searchInput"
placeholder="Search Name, Phone or Product"
onkeyup="searchOrders()">

<select
id="statusFilter"
onchange="filterOrders()">

<option value="All">All Status</option>
<option value="In Progress">In Progress</option>
<option value="Shipped">Shipped</option>
<option value="Delivered">Delivered</option>

</select>

</div>

<!-- Orders Table -->

<table>

<thead>

<tr>

<th>Customer</th>
<th>Phone</th>
<th>Product</th>
<th>Qty</th>
<th>Price</th>
<th>Status</th>
<th>Action</th>

</tr>

</thead>

<tbody id="ordersTable">

</tbody>

</table>

<script src="admin.js"></script>

</body>
</html>
