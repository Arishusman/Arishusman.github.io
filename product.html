<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A.U SHOP | Product</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

</head>

<body>

<!-- NAVBAR -->

<nav class="navbar">

    <div class="logo">

        <img src="logo.png" alt="Logo">

        <h1>A.U SHOP</h1>

    </div>

    <div class="nav-links">

        <a href="index.html">Home</a>

        <a href="wishlist.html">Wishlist</a>

        <a href="track.html">Track</a>

    </div>

</nav>


<!-- PRODUCT SECTION -->

<section class="product-page">

    <!-- LEFT -->

    <div class="product-left">

        <div class="main-image">

            <img id="productImage" src="" alt="Product">

        </div>

    </div>


    <!-- RIGHT -->

    <div class="product-right">

        <h1 id="productName">
            Loading...
        </h1>

        <div class="rating">

            ⭐⭐⭐⭐⭐

            <span>
                4.9 (22 Reviews)
            </span>

        </div>

        <h2 id="productPrice">

            Rs. 0

        </h2>

        <p class="stock">

            ✅ In Stock

        </p>

        <hr>

        <h3>Description</h3>

        <p id="productDescription">

            Product Description

        </p>

        <hr>

        <div class="delivery-box">

            <p>🚚 Free Delivery All Over Pakistan</p>

            <p>🔒 Secure Checkout</p>

            <p>↩ 7 Days Easy Return</p>

        </div>

        

        <div class="product-buttons">

    <button  id="cartBtn" onclick="addCurrentProductToCart()">
        🛒 Add to Cart
    </button>

    <button id="wishlistBtn" onclick="addToWishlist()">
        ❤️ Wishlist
    </button>

</div>

<button id="buyBtn"
class="buy-now-btn"
onclick="buyNowProduct()">
    ⚡ Buy Now
</button>

        </div>

    </div>

</section>


<!-- RELATED PRODUCTS -->

<section>

    <h2 class="section-title">

        Related Products

    </h2>

    <div
        class="products"
        id="relatedProducts"
    >

    </div>

</section>


<!-- FOOTER -->

<footer>

<div class="footer-links">

<a href="index.html">

Home

</a>

<a href="wishlist.html">

Wishlist

</a>

<a href="cart.html">

Checkout

</a>

</div>

<p>

© 2026 A.U SHOP

</p>

</footer>


<script src="script.js"></script>

<script>


    // ==========================================
// PRODUCT PAGE - PART 3
// ==========================================

const product = JSON.parse(localStorage.getItem("selectedProduct"));
console.log(product);

if(!product){

    alert("No Product Found");

}else{

    console.log("Name =", product.name);
    console.log("Price =", product.price);

    document.getElementById("productImage").src =
        product.image || "https://via.placeholder.com/500";

    document.getElementById("productName").innerText =
        product.name;

    document.getElementById("productPrice").innerText =
        "Rs. " + product.price;

    document.getElementById("productDescription").innerText =
        product.description || "No description available.";

}


// ===========================
// IMAGE ZOOM
// ===========================

const image=document.getElementById("productImage");

if(image){

    image.addEventListener("mousemove",()=>{

        image.style.transform="scale(1.25)";

    });

    image.addEventListener("mouseleave",()=>{

        image.style.transform="scale(1)";

    });

}

// ===========================
// RELATED PRODUCTS
// ===========================

async function loadRelatedProducts(){

    try{

        const response=await fetch(PRODUCT_API);

        const data=await response.json();

        const container=document.getElementById("relatedProducts");

        container.innerHTML="";

        data.products
        .filter(p=>p.category===product.category && p._id!==product._id)
        .slice(0,4)
        .forEach(item=>{

            container.innerHTML+=`

            <div class="card product"
            onclick='openProductPage(${JSON.stringify(item)})'>

                <img src="${item.image || 'https://via.placeholder.com/250'}">

                <h3>${item.name}</h3>

                <p>Rs. ${item.price}</p>

                <div class="card-buttons">

                    <button onclick='event.stopPropagation();
addCart(
${JSON.stringify(item.name)},
${item.price},
${JSON.stringify(item.image)},
1
)'>
🛒 Add To Cart
</button>

                </div>

            </div>

            `;

        });

    }

    catch(err){

        console.log(err);

    }

}

loadRelatedProducts();

</script>

<div id="toast"></div>
</body>
</html>
