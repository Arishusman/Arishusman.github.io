<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    
    <title>Products | A.U SHOP</title>

<meta name="description" content="Browse premium Law Books, Cricket Equipment and Hockey Products from A.U SHOP.">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="canonical" href="https://au-shop.netlify.app/product.html">
<link rel="stylesheet" href="style.css">

</head>

<body>

    
    <div class="product-details">

        <img id="productImage" src="" alt="Product Image">

        <h1 id="productName"></h1>
        
        


        <h2 id="productPrice"></h2>
        <div class="quantity-box">

    <button onclick="decreaseQty()">−</button>

    <span id="qty">1</span>

    <button onclick="increaseQty()">+</button>

</div>

        <p class="stock">
    ✅ In Stock
</p>

        <p id="productDescription"></p>

        <div class="delivery-info">

    🚚 Delivery all over Pakistan

    <br><br>

    ⏰ Delivery Time: 2–5 Days

</div>

<div class="product-buttons">

    <button id="cartBtn">
        🛒 Add To Cart
    </button>

    <button id="wishlistBtn">
        ❤️ Wishlist
    </button>

</div>

        <button onclick="history.back()">
            ⬅ Back
        </button>

    </div>

    <script src="script.js"></script>

    <script>

        const product = JSON.parse(localStorage.getItem("selectedProduct"));

        
        document.getElementById("productImage").src =
            product.image || "https://via.placeholder.com/300";

        document.getElementById("productName").innerText =
            product.name;

        document.getElementById("productPrice").innerText =
            "Rs. " + product.price;

        document.getElementById("productDescription").innerText =
            product.description || "No Description Available";



        
        
             if (!product) {

            window.location.href = "index.html";

        }


        // Quantity
let quantity = 1;

function increaseQty() {
    quantity++;
    document.getElementById("qty").innerText = quantity;
}

function decreaseQty() {
    if (quantity > 1) {
        quantity--;
        document.getElementById("qty").innerText = quantity;
    }
}

// Add To Cart
document.getElementById("cartBtn").onclick = function () {
    addCart(product.name, product.price, quantity);
};

// Wishlist
document.getElementById("wishlistBtn").onclick = function () {
    toggleWishlist(product);
};



 

    </script>

<div id="toast"></div>

</body>

</html>
